<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MPA Data Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #0b3c5d; color: white; }
    #controls { padding: 10px 16px; }
    #note { font-size: 13px; color: #555; margin-left: 12px; }
    #map { height: 70vh; background: #dfeaf2; }
  </style>
</head>
<body>
  <header><h1 style="margin:0;font-size:20px">MPA Data Explorer</h1></header>
  <div id="controls">
    <label for="area">Protected area: </label>
    <select id="area"></select>
    <span id="note"></span>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([20, 0], 2);
    let layer = null;
    let features = [];
    const select = document.getElementById("area");
    const note = document.getElementById("note");

    function showArea(id) {
      const f = features.find(x => x.properties.id === id);
      if (!f) return;
      if (layer) map.removeLayer(layer);
      layer = L.geoJSON(f, { style: { color: "#c0392b", weight: 2, fillOpacity: 0.1 } }).addTo(map);
      map.fitBounds(layer.getBounds(), { padding: [30, 30] });
      note.textContent = f.properties.country + " (simplified, approximate outline)";
    }

    fetch("/api/areas")
      .then(r => r.json())
      .then(data => {
        features = data.features;
        features.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f.properties.id;
          opt.textContent = f.properties.name;
          select.appendChild(opt);
        });
        showArea(select.value);
      })
      .catch(err => { note.textContent = "Could not load areas: " + err; });

    select.addEventListener("change", () => showArea(select.value));
  </script>
</body>
</html>
