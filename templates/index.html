<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MPA Data Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #0b3c5d; color: white; }
    #controls { padding: 10px 16px; }
    #note { font-size: 13px; color: #555; margin-left: 12px; }
    #map { height: 50vh; background: #dfeaf2; }
    #panel { padding: 12px 16px; max-width: 1100px; }
    #summary { font-size: 14px; margin: 6px 0 10px; }
    #status { font-size: 13px; color: #8a4b00; }
    .chart-box { position: relative; height: 260px; }
    .legend { font-size: 12px; color: #444; margin-top: 4px; }
  </style>
</head>
<body>
  <header><h1 style="margin:0;font-size:20px">MPA Data Explorer</h1></header>
  <div id="controls">
    <label for="area">Protected area: </label>
    <select id="area"></select>
    <a id="csv" href="#" style="margin-left:12px;font-size:13px">Download CSV (sample)</a>
    <span id="note"></span>
    <span id="status"></span>
  </div>
  <div id="map"></div>
  <div id="panel">
    <h2 style="font-size:16px;margin:0">Records per year</h2>
    <div id="summary"></div>
    <div class="chart-box"><canvas id="years"></canvas></div>
    <div class="legend">Blue bars: years with records. Red bars: years with no records. Map cells: number of OBIS records (darker = more).</div>
    <h2 style="font-size:16px;margin:22px 0 0">Records per phylum</h2>
    <div id="phsummary" style="font-size:14px;margin:6px 0 10px"></div>
    <div class="chart-box" style="height:380px"><canvas id="phyla"></canvas></div>
    <div class="legend">Blue bars: major groups with records. Red bars: major marine groups with no records here.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    const map = L.map("map").setView([20, 0], 2);
    let outline = null, cells = null, chart = null, features = [], token = 0;
    const select = document.getElementById("area");
    const note = document.getElementById("note");
    const statusEl = document.getElementById("status");
    const summary = document.getElementById("summary");

    function colour(n, max) {
      const t = Math.log(n + 1) / Math.log(max + 1);
      const l = 85 - 55 * t;
      return "hsl(210, 70%, " + l + "%)";
    }

    function drawCells(data) {
      if (cells) map.removeLayer(cells);
      const max = Math.max(1, ...data.features.map(f => f.properties.n));
      cells = L.geoJSON(data, {
        style: f => ({ color: "#1f4e79", weight: 0.5, fillOpacity: 0.7,
                       fillColor: colour(f.properties.n, max) }),
        onEachFeature: (f, layer) => layer.bindTooltip(f.properties.n.toLocaleString() + " records")
      }).addTo(map);
      if (outline) outline.bringToFront();
    }

    function drawYears(d) {
      const ymax = Math.max(1, ...d.records);
      const present = d.records.map(n => (n > 0 ? n : null));
      const gaps = d.records.map(n => (n === 0 ? ymax : null));
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("years"), {
        type: "bar",
        data: { labels: d.years, datasets: [
          { label: "Records", data: present, backgroundColor: "#2e75b6" },
          { label: "No records", data: gaps, backgroundColor: "rgba(192,57,43,0.35)" }
        ]},
        options: { responsive: true, maintainAspectRatio: false, animation: false,
          scales: { x: { stacked: true, ticks: { maxTicksLimit: 15 } },
                    y: { stacked: true, title: { display: true, text: "records" } } },
          plugins: { legend: { display: false },
            tooltip: { callbacks: { label: c => c.dataset.label === "No records" ? "No records" : c.parsed.y.toLocaleString() + " records" } } } }
      });
    }

    function showSummary(d) {
      if (!d.total) { summary.textContent = "No OBIS records found inside this area."; return; }
      summary.textContent = d.total.toLocaleString() + " records dated between " + d.first_year +
        " and " + d.last_year + ". " + d.empty_years + " of " + d.span_years +
        " years (" + d.first_year + " to now) have no records.";
    }

    let phChart = null;
    function drawPhyla(d) {
      const items = d.phyla;
      const max = Math.max(1, ...items.map(i => i.records));
      const labels = items.map(i => i.phylum + (i.records ? " (" + i.records.toLocaleString() + ")" : " (none)"));
      const present = items.map(i => (i.records > 0 ? i.records : null));
      const gaps = items.map(i => (i.records === 0 ? max : null));
      const empty = items.filter(i => i.records === 0).length;
      document.getElementById("phsummary").textContent =
        (items.length - empty) + " phyla have records; " + empty + " major marine groups have none." +
        (d.truncated ? " Note: the list was capped, so some taxa may be missing." : "");
      if (phChart) phChart.destroy();
      phChart = new Chart(document.getElementById("phyla"), {
        type: "bar",
        data: { labels: labels, datasets: [
          { label: "Records", data: present, backgroundColor: "#2e75b6" },
          { label: "No records", data: gaps, backgroundColor: "rgba(192,57,43,0.35)" }
        ]},
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, animation: false,
          scales: { x: { stacked: true, title: { display: true, text: "records" } }, y: { stacked: true } },
          plugins: { legend: { display: false },
            tooltip: { callbacks: { label: c => c.dataset.label === "No records" ? "No records" : c.parsed.x.toLocaleString() + " records" } } } }
      });
    }

    async function getJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      return r.json();
    }

    async function loadData(id) {
      const mine = ++token;
      statusEl.textContent = "Loading OBIS data...";
      summary.textContent = "";
      try {
        const [grid, yrs, ph] = await Promise.all([
          getJSON("/api/areas/" + id + "/grid"), getJSON("/api/areas/" + id + "/years"),
          getJSON("/api/areas/" + id + "/phyla")]);
        if (mine !== token) return;
        drawCells(grid); showSummary(yrs); drawYears(yrs); drawPhyla(ph);
        statusEl.textContent = "";
      } catch (e) {
        if (mine === token) statusEl.textContent = "Could not load OBIS data: " + e.message;
      }
    }

    function showArea(id) {
      const f = features.find(x => x.properties.id === id);
      if (!f) return;
      if (outline) map.removeLayer(outline);
      if (cells) { map.removeLayer(cells); cells = null; }
      outline = L.geoJSON(f, { style: { color: "#c0392b", weight: 2, fillOpacity: 0 } }).addTo(map);
      map.fitBounds(outline.getBounds(), { padding: [30, 30] });
      note.textContent = f.properties.country + " (simplified, approximate outline)";
      document.getElementById("csv").href = "/api/areas/" + id + "/records.csv";
      loadData(id);
    }

    fetch("/api/areas").then(r => r.json()).then(data => {
      features = data.features;
      features.forEach(f => {
        const opt = document.createElement("option");
        opt.value = f.properties.id; opt.textContent = f.properties.name;
        select.appendChild(opt);
      });
      showArea(select.value);
    }).catch(err => { note.textContent = "Could not load areas: " + err; });

    select.addEventListener("change", () => showArea(select.value));
  </script>
</body>
</html>
